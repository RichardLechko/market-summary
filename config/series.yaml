# FRED series shown in the summary.
#
# kind:
#   price           daily level, change in % since the last summary
#   rate            daily percent, change in basis points since the last summary
#   index_yoy       monthly index shown as year-over-year %, change in pp vs prior month
#   monthly_change  monthly level shown as the month's change (e.g. jobs added)
#   level           shown as-is, change vs prior observation; delta: pct or diff
# group: "Market" goes in the Market section; anything else becomes a heading
#   in the Economy section (monthly/weekly series appear only when newly released).
# flag_threshold: absolute change (in the row's change unit) that marks a notable move.
# about: one plain-language line shown under the name.

series:
  - id: SP500
    name: S&P 500
    group: Market
    kind: price
    flag_threshold: 2
    about: The 500 largest US companies. The usual shorthand for "the stock market."
  - id: NASDAQCOM
    name: Nasdaq Composite
    group: Market
    kind: price
    flag_threshold: 3
    about: Weighted heavily toward technology companies, so it swings more than the S&P 500.
  - id: DJIA
    name: Dow Jones Industrial
    group: Market
    kind: price
    flag_threshold: 2
    about: 30 large, established US companies. The oldest index, narrower than the S&P 500.
  - id: VIXCLS
    name: VIX
    group: Market
    kind: price
    flag_threshold: 15
    about: The "fear gauge" — how much turbulence traders expect next month. Around 15 is calm; above 30 is fearful.

  - id: DFF
    name: Fed funds rate
    group: Rates
    kind: rate
    flag_threshold: 10
    about: The overnight rate the Fed controls. Every other interest rate builds on it.
  - id: DGS2
    name: 2-year Treasury
    group: Rates
    kind: rate
    flag_threshold: 15
    about: What the government pays to borrow for two years. Tracks where markets expect the Fed to go.
  - id: DGS10
    name: 10-year Treasury
    group: Rates
    kind: rate
    flag_threshold: 15
    about: The benchmark long-term rate. Mortgages and corporate loans are priced off it.
  - id: T10Y2Y
    name: 10-year minus 2-year
    group: Rates
    kind: rate
    flag_threshold: 15
    about: Below zero ("inverted") has historically come before recessions.

  - id: CPIAUCSL
    name: CPI inflation
    group: Inflation
    kind: index_yoy
    flag_threshold: 0.2
    about: How much prices of everyday goods and services rose over the past year.
  - id: PCEPILFE
    name: Core PCE inflation
    group: Inflation
    kind: index_yoy
    flag_threshold: 0.2
    about: The Fed's preferred inflation gauge, excluding food and energy. The Fed targets 2%.

  - id: PAYEMS
    name: Jobs added
    group: Labor
    kind: monthly_change
    unit: K
    flag_threshold: 100
    about: Net jobs employers added last month, in thousands. Roughly 100K–150K keeps pace with population growth.
  - id: UNRATE
    name: Unemployment rate
    group: Labor
    kind: level
    unit: "%"
    delta: diff
    flag_threshold: 0.2
    about: Share of people looking for work who can't find it.
  - id: ICSA
    name: Initial jobless claims
    group: Labor
    kind: level
    delta: pct
    flag_threshold: 10
    about: New unemployment-benefit applications last week. A rising trend is an early sign of layoffs.

  - id: BAMLH0A0HYM2
    name: High-yield credit spread
    group: Credit
    kind: rate
    flag_threshold: 25
    about: Extra interest riskier companies pay over the government. Widening means lenders are nervous.
  - id: UMCSENT
    name: Consumer sentiment
    group: Consumer
    kind: level
    delta: diff
    flag_threshold: 5
    about: University of Michigan survey of how households feel about money and the economy. Lower is gloomier.

  - id: DCOILWTICO
    name: Oil (WTI, $/barrel)
    group: Commodities
    kind: price
    flag_threshold: 5
    about: US crude oil price. Feeds into gas prices and inflation.
